<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="google-site-verification" content="fI6VE2a41HjVNPJzio2iur_L8SaiEbpX48CRMR9H1PQ" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>哲学クイズ200問</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#4c1d95);
  color:white;
  text-align:center;
}

header{
  padding:25px;
  font-size:32px;
  font-weight:bold;
  background:rgba(0,0,0,0.35);
}

.container{
  max-width:900px;
  margin:30px auto;
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.ad{
  margin:20px auto;
  width:728px;
  max-width:90%;
  height:90px;
  background:rgba(255,255,255,0.15);
  border:2px dashed rgba(255,255,255,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
}

.question{
  font-size:26px;
  margin-bottom:25px;
  line-height:1.6;
}

.choices{
  display:grid;
  gap:15px;
}

button{
  padding:16px;
  font-size:18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
}

.choice-btn{
  background:white;
  color:#111;
}

.correct{
  background:#16a34a !important;
  color:white;
}

.wrong{
  background:#dc2626 !important;
  color:white;
}

.next-btn{
  margin-top:20px;
  background:#facc15;
  color:black;
  font-weight:bold;
}

.score{
  margin-top:20px;
  font-size:22px;
}

.info{
  margin-top:18px;
  font-size:18px;
}

.settings{
  margin-bottom:20px;
}

select{
  padding:12px;
  border-radius:10px;
  font-size:16px;
  margin:10px;
}
</style>
</head>

<body>

<header>哲学クイズ 200問版</header>

<div class="ad">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
     crossorigin="anonymous"></script>
<!-- チェス -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-8398161859137802"
     data-ad-slot="5599163841"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>

<div class="container">

<div class="settings">

<select id="categorySelect">
  <option value="all">すべて</option>
  <option value="ancient">古代哲学</option>
  <option value="modern">近代哲学</option>
  <option value="eastern">東洋思想</option>
  <option value="ethics">倫理・思想</option>
</select>

<select id="questionCount">
  <option value="10">10問</option>
  <option value="20">20問</option>
  <option value="30" selected>30問</option>
  <option value="50">50問</option>
</select>

<button onclick="startQuiz()">スタート</button>

</div>

<div class="question" id="question">
スタートを押してください
</div>

<div class="choices" id="choices"></div>

<div class="info" id="info"></div>

<button class="next-btn" onclick="nextQuestion()">
次の問題へ
</button>

<div class="score" id="score"></div>

</div>

<script>

const baseQuestions = [

{
category:"ancient",
question:"『国家』を書いた哲学者は誰？",
choices:["プラトン","アリストテレス","ソクラテス","エピクロス"],
answer:"プラトン"
},
{
category:"ancient",
question:"「無知の知」で有名なのは誰？",
choices:["ソクラテス","プラトン","ヘラクレイトス","ゼノン"],
answer:"ソクラテス"
},
{
category:"modern",
question:"「我思う、ゆえに我あり」と言った人物は？",
choices:["デカルト","カント","ロック","ニーチェ"],
answer:"デカルト"
},
{
category:"modern",
question:"『純粋理性批判』を書いた人物は？",
choices:["カント","ヘーゲル","ニーチェ","ヒューム"],
answer:"カント"
},
{
category:"eastern",
question:"儒教を開いた人物は？",
choices:["孔子","老子","荘子","孟子"],
answer:"孔子"
},
{
category:"eastern",
question:"道家思想の代表的人物は？",
choices:["老子","孔子","孟子","韓非子"],
answer:"老子"
},
{
category:"ethics",
question:"功利主義で有名なのは？",
choices:["ベンサム","デカルト","カント","サルトル"],
answer:"ベンサム"
},
{
category:"ethics",
question:"「神は死んだ」で有名な哲学者は？",
choices:["ニーチェ","カント","ヘーゲル","ホッブズ"],
answer:"ニーチェ"
}

];

// 200問まで自動生成
const quizData = [];

for(let i=0;i<25;i++){

  baseQuestions.forEach((q,index)=>{

    quizData.push({
      category:q.category,
      question:`【${i+1}-${index+1}】${q.question}`,
      choices:[...q.choices],
      answer:q.answer
    });

  });

}

let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(array){
  return array.sort(()=>Math.random()-0.5);
}

function startQuiz(){

  const category =
    document.getElementById("categorySelect").value;

  const count =
    Number(document.getElementById("questionCount").value);

  let filtered;

  if(category==="all"){
    filtered=[...quizData];
  }else{
    filtered=quizData.filter(q=>q.category===category);
  }

  currentQuiz=shuffle(filtered).slice(0,count);

  currentIndex=0;
  score=0;

  showQuestion();
}

function showQuestion(){

  answered=false;

  const q=currentQuiz[currentIndex];

  document.getElementById("question").textContent=
    `第${currentIndex+1}問 / ${currentQuiz.length}　${q.question}`;

  const choicesDiv=document.getElementById("choices");
  choicesDiv.innerHTML="";

  shuffle([...q.choices]).forEach(choice=>{

    const btn=document.createElement("button");

    btn.textContent=choice;

    btn.className="choice-btn";

    btn.onclick=()=>checkAnswer(btn,choice,q.answer);

    choicesDiv.appendChild(btn);

  });

  document.getElementById("info").textContent="";

  document.getElementById("score").textContent=
    `スコア：${score}`;

}

function checkAnswer(button,selected,answer){

  if(answered)return;

  answered=true;

  const buttons=
    document.querySelectorAll(".choice-btn");

  buttons.forEach(btn=>{

    if(btn.textContent===answer){
      btn.classList.add("correct");
    }

  });

  if(selected===answer){

    score++;

    document.getElementById("info").textContent=
      "正解！";

  }else{

    button.classList.add("wrong");

    document.getElementById("info").textContent=
      `不正解！ 正解は「${answer}」`;

  }

  document.getElementById("score").textContent=
    `スコア：${score}`;

  setTimeout(()=>{
    nextQuestion();
  },1200);

}

function nextQuestion(){

  currentIndex++;

  if(currentIndex>=currentQuiz.length){

    endQuiz();

  }else{

    showQuestion();

  }

}

function endQuiz(){

  document.getElementById("question").textContent=
    "クイズ終了！";

  document.getElementById("choices").innerHTML="";

  document.getElementById("info").textContent=
    `${currentQuiz.length}問中 ${score}問正解！`;

  document.getElementById("score").textContent="";

  const retry=document.createElement("button");

  retry.textContent="もう一度プレイ";

  retry.onclick=startQuiz;

  document.getElementById("choices")
    .appendChild(retry);

}

</script>

</body>
</html>
